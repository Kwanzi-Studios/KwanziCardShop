<body data-page="binder">
<div class="wrap">
<header class="top"><h1>kwanzi <b>card shop</b></h1></header>

</div>

<h1 class="sans" id="title" style="font-size:24px;margin:0 0 6px"></h1>
<div class="tiles" id="tiles"></div>
<h2>the cards</h2>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
</main>
<p class="stamp" id="stamp"></p>
<p class="stamp">redeem packs with channel points at <a href="https://twitch.tv/kwanzi">kwanzi</a> on twitch. you need a card binder from the kwanzshi shop to keep what you pull.</p>
</div>
